<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChojemaWebDelta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fbf'/%3E%3Cpath d='M16 7 26 25H6Z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>ChojemaWebDelta</h1>
      <span id="version" class="muted"></span>
    </div>
    <div id="counts" class="counts" aria-live="polite"></div>
    <label class="sort muted"><span data-i18n="sort_label"></span>
      <select id="sort">
        <option value="status" data-i18n="sort_status"></option>
        <option value="newest" data-i18n="sort_newest"></option>
        <option value="oldest" data-i18n="sort_oldest"></option>
        <option value="name" data-i18n="sort_name"></option>
      </select>
    </label>
    <div class="actions">
      <button id="ack-all" type="button" data-i18n="ack_all" hidden></button>
      <button id="check-all" class="primary" type="button" data-i18n="check_all"></button>
      <button id="auto" type="button" data-i18n="auto_turn_on" data-i18n-attr="title:auto_title"></button>
      <button id="add-site" type="button" data-i18n="add_site"></button>
      <details id="manage" class="menu">
        <summary data-i18n="manage"></summary>
        <div class="menu-items">
          <button id="export" type="button" data-i18n="export"></button>
          <button id="import" type="button" data-i18n="import"></button>
          <button id="delete-all" class="danger-text" type="button" data-i18n="delete_all"></button>
        </div>
      </details>
      <input id="import-file" type="file" accept=".json,.txt,application/json,text/plain" hidden>
      <button id="quit" class="quiet" type="button" data-i18n="quit"></button>
    </div>
    <div id="progress" class="progress" hidden><div id="progress-fill" class="progress-fill"></div></div>
  </header>

  <main>
    <p id="notice" class="notice" hidden></p>
    <div id="selection" class="selection" hidden>
      <label><input id="select-all" type="checkbox"> <span data-i18n="select_all"></span></label>
      <span id="selection-count"></span>
      <span class="spacer"></span>
      <button id="selection-clear" class="small quiet" type="button" data-i18n="selection_clear"></button>
      <button id="selection-delete" class="small danger" type="button" data-i18n="selection_delete"></button>
    </div>
    <ul id="sites" class="sites"></ul>
    <p id="empty" class="empty" data-i18n-html="empty_html" hidden></p>
    <p id="clock" class="clock muted" aria-hidden="true"></p>
    <p id="auto-status" class="clock muted" hidden></p>
  </main>

  <footer class="infobar">
    <span class="credit">Chulwoo Park, <span id="year"></span></span>
    <span class="data-dir muted"><span data-i18n="data_dir_label"></span> <span id="data-dir"></span></span>
    <select id="lang" class="lang" data-i18n-attr="aria-label:language">
      <option value="ko" lang="ko">한국어</option>
      <option value="en" lang="en">English</option>
    </select>
    <nav class="links" data-i18n-attr="aria-label:links_label">
      <a href="https://cantips.com" target="_blank" rel="noopener noreferrer" title="Blog" data-i18n-attr="aria-label:link_new_window" data-i18n-name="Blog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </a>
      <a href="https://www.youtube.com/@cantips" target="_blank" rel="noopener noreferrer" title="YouTube" data-i18n-attr="aria-label:link_new_window" data-i18n-name="YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
      </a>
      <a href="https://twitter.com/chojema" target="_blank" rel="noopener noreferrer" title="X" data-i18n-attr="aria-label:link_new_window" data-i18n-name="X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L2.25 2.25h6.921l4.255 5.623 4.818-5.623zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="https://www.instagram.com/chojema" target="_blank" rel="noopener noreferrer" title="Instagram" data-i18n-attr="aria-label:link_new_window" data-i18n-name="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

      <a href="https://github.com/chojema" target="_blank" rel="noopener noreferrer" title="GitHub" data-i18n-attr="aria-label:link_new_window" data-i18n-name="GitHub">

      </a>
    </nav>
  </footer>

  <dialog id="site-dialog">
    <form id="site-form" method="dialog">
      <h2 id="dialog-title"></h2>
      <label><span data-i18n="field_url"></span>
        <input name="url" type="url" required placeholder="https://example.com/notice">
      </label>
      <label><span data-i18n="field_name"></span> <span class="muted" data-i18n="field_name_hint"></span>
        <input name="name" type="text" maxlength="100">
      </label>
      <label><span data-i18n="field_selector"></span> <span class="muted" data-i18n="field_selector_hint"></span>
        <input name="selector" type="text" data-i18n-attr="placeholder:selector_placeholder">
      </label>
      <details class="help">
        <summary data-i18n="selector_help_summary"></summary>
        <p data-i18n="selector_help_lead"></p>
        <ul id="selector-examples" class="examples"></ul>
        <ul class="help-notes">
          <li data-i18n="selector_note_combine"></li>
          <li data-i18n-html="selector_note_text_html"></li>
        </ul>
      </details>
      <label><span data-i18n="field_ignore"></span> <span class="muted" data-i18n="field_ignore_hint"></span>
        <textarea name="ignore_patterns" rows="3" data-i18n-attr="placeholder:ignore_placeholder"></textarea>
      </label>
      <details class="help">
        <summary data-i18n="pattern_help_summary"></summary>
        <p data-i18n="pattern_help_lead"></p>
        <ul id="pattern-examples" class="examples"></ul>
        <ul class="help-notes">
          <li data-i18n-html="pattern_note_partial_html"></li>
          <li data-i18n-html="pattern_note_syntax_html"></li>
          <li data-i18n-html="pattern_note_escape_html"></li>
          <li data-i18n="pattern_note_spaces"></li>
        </ul>
      </details>
      <p id="form-error" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="quiet" type="button" data-i18n="cancel"></button>
        <button class="primary" type="submit" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="auto-dialog">
    <form id="auto-form" method="dialog">
      <h2 data-i18n="auto_dialog_title"></h2>
      <p class="dialog-lead" data-i18n="auto_dialog_lead"></p>
      <div id="auto-options" class="options"></div>
      <div class="custom-row">
        <label class="option"><input type="radio" name="interval" value="custom"> <span data-i18n="auto_custom"></span></label>
        <span data-i18n="auto_custom_prefix"></span>
        <input id="auto-custom-value" type="number" min="1" step="1" value="15" data-i18n-attr="aria-label:auto_custom_value">
        <select id="auto-custom-unit" data-i18n-attr="aria-label:auto_custom_unit">
          <option value="60" data-i18n="auto_unit_minutes"></option>
          <option value="3600" data-i18n="auto_unit_hours"></option>
          <option value="86400" data-i18n="auto_unit_days"></option>
        </select>
        <span data-i18n="auto_custom_suffix"></span>
      </div>
      <p id="auto-warning" class="warning" data-i18n="auto_warning"></p>
      <p id="auto-error" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button id="auto-cancel" class="quiet" type="button" data-i18n="cancel"></button>
        <button class="primary" type="submit" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="quiet" value="cancel" data-i18n="cancel" autofocus></button>
        <button id="confirm-ok" class="danger solid" value="ok" data-i18n="delete"></button>
      </div>
    </form>
  </dialog>

  <div id="overlay" class="overlay" hidden>
    <p id="overlay-text"></p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
